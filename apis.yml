aid: bigchaindb
name: Bigchaindb
description: >-
  BigchainDB is an open-source blockchain database that combines the developer
  experience and query power of a database with blockchain properties:
  decentralized (Byzantine fault-tolerant) control, immutable append-only data
  storage, and built-in support for registering and transferring assets.
  Developed by BigchainDB GmbH (Berlin) with the IPDB Foundation overseeing the
  software and public networks, it exposes a simple versioned HTTP API on each
  node (default port 9984) for creating and reading transactions, assets,
  outputs, metadata, blocks and validators. Applications sign transactions with
  Ed25519 crypto-conditions, so authorization is enforced at the payload level
  rather than via transport authentication. Official Python, JavaScript and Java
  drivers are published, and the maintained continuation of the codebase is the
  Planetmint project.
