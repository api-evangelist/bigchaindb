openapi: 3.2.0
info:
  title: BigchainDB HTTP Metadata API
  version: v1
  description: The BigchainDB HTTP Client-Server API.
  x-apievangelist-generated: true
  x-source: https://docs.bigchaindb.com/projects/server/en/latest/http-client-server-api.html
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: BigchainDB GmbH
    url: https://www.bigchaindb.com/
servers:
- url: https://{host}:9984
  description: A BigchainDB node (self-hosted or hosted network). Default node port is 9984.
  variables:
    host:
      default: test.ipdb.io
      description: Hostname of a BigchainDB node (the IPDB test network historically ran at test.ipdb.io).
tags:
- name: Metadata
  description: Full-text search over transaction metadata.
paths:
  /api/v1/metadata:
    get:
      tags:
      - Metadata
      operationId: searchMetadata
      summary: Search metadata
      description: Full-text search over transaction metadata objects.
      parameters:
      - name: search
        in: query
        required: true
        description: The text to search for in metadata.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Maximum number of results to return.
        schema:
          type: integer
      responses:
        '200':
          description: A list of matching metadata objects.
        '400':
          description: The search parameter was missing.
externalDocs:
  description: BigchainDB Server HTTP Client-Server API
  url: https://docs.bigchaindb.com/projects/server/en/latest/http-client-server-api.html
