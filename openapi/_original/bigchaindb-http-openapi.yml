openapi: 3.0.3
info:
  title: BigchainDB HTTP API
  version: v1
  description: >-
    The BigchainDB HTTP Client-Server API. BigchainDB is an open-source blockchain
    database that combines high throughput, low latency, immutable data storage and
    built-in asset support with decentralized control. This document is a faithful
    transcription of the operations, parameters and status codes published in the
    official BigchainDB Server HTTP API reference; BigchainDB does not publish its
    own machine-readable OpenAPI, so this spec was generated by the API Evangelist
    enrichment pipeline from the documented endpoint reference.
  x-apievangelist-generated: true
  x-source: https://docs.bigchaindb.com/projects/server/en/latest/http-client-server-api.html
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: BigchainDB GmbH
    url: https://www.bigchaindb.com/
externalDocs:
  description: BigchainDB Server HTTP Client-Server API
  url: https://docs.bigchaindb.com/projects/server/en/latest/http-client-server-api.html
servers:
  - url: https://{host}:9984
    description: A BigchainDB node (self-hosted or hosted network). Default node port is 9984.
    variables:
      host:
        default: test.ipdb.io
        description: Hostname of a BigchainDB node (the IPDB test network historically ran at test.ipdb.io).
tags:
  - name: Root
    description: Node discovery endpoints.
  - name: Transactions
    description: Create and read transactions (CREATE and TRANSFER operations).
  - name: Outputs
    description: List transaction outputs by public key.
  - name: Assets
    description: Full-text search over asset payloads.
  - name: Metadata
    description: Full-text search over transaction metadata.
  - name: Blocks
    description: Read blocks by height or by contained transaction.
  - name: Validators
    description: Read the node's validator set.
paths:
  /:
    get:
      tags: [Root]
      operationId: getApiRoot
      summary: Discover node version and API endpoints
      description: Returns the BigchainDB node software version and the set of available API endpoint URLs.
      responses:
        '200':
          description: Node information and endpoint map.
  /api/v1/:
    get:
      tags: [Root]
      operationId: getApiV1Root
      summary: List available API v1 resources
      description: Returns the list of available resource endpoints under the v1 API.
      responses:
        '200':
          description: Map of available v1 resource URLs.
  /api/v1/transactions/{transaction_id}:
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a transaction by ID
      description: Retrieve a single committed transaction by its transaction id.
      parameters:
        - name: transaction_id
          in: path
          required: true
          description: The id of the transaction to retrieve.
          schema: { type: string }
      responses:
        '200':
          description: The requested transaction.
        '404':
          description: A transaction with that id was not found (or is not yet committed).
  /api/v1/transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions for an asset
      description: >-
        Get a list of transactions that use an asset with the given asset_id. The
        operation type (CREATE or TRANSFER) may be filtered, and last_tx returns only
        the latest transaction.
      parameters:
        - name: asset_id
          in: query
          required: true
          description: The asset id to filter transactions by.
          schema: { type: string }
        - name: operation
          in: query
          required: false
          description: Filter by transaction operation.
          schema:
            type: string
            enum: [CREATE, TRANSFER]
        - name: last_tx
          in: query
          required: false
          description: When true, return only the last transaction.
          schema: { type: boolean }
      responses:
        '200':
          description: A list of matching transactions.
        '400':
          description: The request was malformed or a required parameter was missing.
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Submit a transaction
      description: >-
        Push a new transaction to the node. The signed transaction is validated and,
        depending on mode, returned when accepted (async), when validated (sync), or
        when committed to a block (commit).
      parameters:
        - name: mode
          in: query
          required: false
          description: Persistence/acknowledgement mode for the submitted transaction.
          schema:
            type: string
            enum: [async, sync, commit]
            default: async
      requestBody:
        required: true
        description: A signed BigchainDB transaction (CREATE or TRANSFER).
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: The transaction was accepted for processing.
        '400':
          description: The transaction was invalid (bad signature, schema, or amount).
  /api/v1/outputs:
    get:
      tags: [Outputs]
      operationId: listOutputs
      summary: List outputs by public key
      description: >-
        Get transaction outputs associated with a given public key. Optionally filter
        to only spent or only unspent outputs.
      parameters:
        - name: public_key
          in: query
          required: true
          description: The public key to list outputs for.
          schema: { type: string }
        - name: spent
          in: query
          required: false
          description: When set, filter to spent (true) or unspent (false) outputs.
          schema: { type: boolean }
      responses:
        '200':
          description: A list of output links (transaction id + output index).
        '400':
          description: A required parameter was missing or malformed.
  /api/v1/assets:
    get:
      tags: [Assets]
      operationId: searchAssets
      summary: Search assets
      description: Full-text search over the data payloads of CREATE-transaction assets.
      parameters:
        - name: search
          in: query
          required: true
          description: The text to search for in asset payloads.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return.
          schema: { type: integer }
      responses:
        '200':
          description: A list of matching assets.
        '400':
          description: The search parameter was missing.
  /api/v1/metadata:
    get:
      tags: [Metadata]
      operationId: searchMetadata
      summary: Search metadata
      description: Full-text search over transaction metadata objects.
      parameters:
        - name: search
          in: query
          required: true
          description: The text to search for in metadata.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return.
          schema: { type: integer }
      responses:
        '200':
          description: A list of matching metadata objects.
        '400':
          description: The search parameter was missing.
  /api/v1/validators:
    get:
      tags: [Validators]
      operationId: getValidators
      summary: Get the validator set
      description: Return the local validator set of the node, with each validator's public key and voting power.
      responses:
        '200':
          description: The node's current validator set.
  /api/v1/blocks/{block_height}:
    get:
      tags: [Blocks]
      operationId: getBlock
      summary: Get a block by height
      description: Retrieve the block at the given height, including the list of transaction ids it contains.
      parameters:
        - name: block_height
          in: path
          required: true
          description: The height of the block to retrieve.
          schema: { type: integer }
      responses:
        '200':
          description: The requested block.
        '404':
          description: No block exists at that height.
  /api/v1/blocks:
    get:
      tags: [Blocks]
      operationId: listBlocks
      summary: List blocks containing a transaction
      description: Get the heights of the blocks that contain the transaction with the given transaction_id.
      parameters:
        - name: transaction_id
          in: query
          required: true
          description: The transaction id to look up.
          schema: { type: string }
      responses:
        '200':
          description: A list of block heights containing the transaction.
        '400':
          description: The transaction_id parameter was missing.
